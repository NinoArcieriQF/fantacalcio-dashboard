*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d0f13;--card:#161922;--green:#1B7A3D;--green-lt:#E8F5E9;--gold:#FFF8E1;--red:#C62828;--red-lt:#FFEBEE;--blue:#1565C0;--orange:#FF9800;--pink:#E91E63;--gray:#888;--border:#2a2d38;--text:#e8e8e8;--text2:#aaa}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:linear-gradient(135deg,#0d1f15,#0a1a1f);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--green);position:sticky;top:0;z-index:100}
.header h1{font-size:16px;letter-spacing:2px;color:#fff;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#4afa8a;box-shadow:0 0 8px #4afa8a;animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--card)}
.tab{flex:1;padding:10px;text-align:center;font-size:12px;font-weight:700;letter-spacing:1px;cursor:pointer;color:var(--text2);transition:.2s}
.tab.active{color:#4afa8a;border-bottom:2px solid #4afa8a}
.tab:hover{color:#fff}
.content{padding:12px;max-width:1400px;margin:0 auto}
.input-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.input-bar input,.input-bar select{background:var(--card);border:1px solid var(--border);color:#fff;padding:10px 14px;border-radius:8px;font-size:14px;outline:none}
.input-bar input:focus,.input-bar select:focus{border-color:var(--green)}
.input-bar input[type=text]{flex:1;min-width:200px}
.input-bar select{min-width:160px}
.input-bar input[type=number]{width:90px}
.btn{padding:10px 20px;border-radius:8px;border:none;font-weight:700;font-size:13px;cursor:pointer;transition:.2s}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{background:#22a04d}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{background:#e53935}
.btn-blue{background:var(--blue);color:#fff}
.btn-sm{padding:6px 12px;font-size:11px}
.suggestions{background:var(--card);border:1px solid var(--border);border-radius:8px;max-height:200px;overflow-y:auto;margin-bottom:8px}
.suggestion{padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);font-size:13px}
.suggestion:hover{background:rgba(74,250,138,.1)}
.suggestion .name{font-weight:700}
.suggestion .info{color:var(--text2);font-size:11px}
.suggestion .target{color:#4afa8a;font-weight:700}
.suggestion .signal{font-size:10px;padding:2px 6px;border-radius:4px}
.signal-affare{background:rgba(74,250,138,.15);color:#4afa8a}
.signal-trappola{background:rgba(198,40,40,.15);color:#ef4444}
.teams-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-bottom:16px}
.team-card{background:var(--card);border-radius:12px;border:1px solid var(--border);overflow:hidden}
.team-header{padding:8px 12px;font-weight:700;font-size:13px;display:flex;justify-content:space-between;color:#fff}
.team-budget{font-size:18px;font-weight:900;color:#4afa8a}
.team-slots{display:flex;gap:4px;padding:4px 12px}
.slot{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:700}
.slot-P{background:rgba(255,152,0,.2);color:#FF9800}
.slot-D{background:rgba(33,150,243,.2);color:#2196F3}
.slot-C{background:rgba(76,175,80,.2);color:#4CAF50}
.slot-A{background:rgba(233,30,99,.2);color:#E91E63}
.roster-list{padding:4px 8px 8px}
.roster-player{font-size:11px;padding:3px 6px;display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.03)}
.roster-player .rp-name{color:var(--text)}
.roster-player .rp-price{color:var(--text2);font-weight:700}
.role-section{margin-bottom:2px}
.role-label{font-size:9px;font-weight:700;padding:2px 6px;letter-spacing:1px}
.stats-bar{display:flex;gap:16px;margin-bottom:12px;flex-wrap:wrap}
.stat-card{background:var(--card);border-radius:10px;padding:12px 16px;border:1px solid var(--border);min-width:120px;text-align:center}
.stat-val{font-size:24px;font-weight:900;color:#4afa8a}
.stat-label{font-size:10px;color:var(--text2);margin-top:2px}
.player-table{width:100%;border-collapse:collapse}
.player-table th{background:var(--card);padding:8px;font-size:11px;color:var(--text2);text-align:left;position:sticky;top:0}
.player-table td{padding:6px 8px;font-size:12px;border-bottom:1px solid rgba(255,255,255,.04)}
.player-table tr:hover{background:rgba(255,255,255,.03)}
.player-table tr.sold{opacity:.4;text-decoration:line-through}
.tier-elite{background:rgba(255,248,225,.08)}
.tier-top{background:rgba(232,245,233,.06)}
.filter-bar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.filter-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:11px;font-weight:700;cursor:pointer}
.filter-btn.active{border-color:var(--green);color:#4afa8a;background:rgba(74,250,138,.1)}
.log{max-height:200px;overflow-y:auto;margin-top:10px}
.log-entry{padding:6px 10px;font-size:12px;border-left:3px solid var(--green);margin-bottom:4px;background:rgba(74,250,138,.05);border-radius:0 6px 6px 0}
.log-entry.overpay{border-color:var(--red);background:rgba(198,40,40,.05)}
.hidden{display:none}
@media(max-width:768px){.teams-grid{grid-template-columns:1fr 1fr}.stats-bar{gap:8px}.stat-card{min-width:80px;padding:8px}}
</style>
</head>

const PLAYERS=RAW.map((p,i)=>({id:i,name:p[0],role:p[1],team:p[2],qt:p[3],fm:p[4],vorp:p[5],target:p[6],max:p[7],signal:p[8],tier:p[9],hist:p[10]}));
const ROLES=[{k:"P",n:"POR",c:"#FF9800",max:3},{k:"D",n:"DIF",c:"#2196F3",max:8},{k:"C",n:"CEN",c:"#4CAF50",max:8},{k:"A",n:"ATT",c:"#E91E63",max:6}];
const BUDGET=350;

let teams=[];
let purchases=[];
let currentTab="registra";

function init(){
  const saved=localStorage.getItem("asta2627");
  if(saved){const d=JSON.parse(saved);teams=d.teams||[];purchases=d.purchases||[];}
  if(!teams.length)teams=Array.from({length:10},(_,i)=>({id:i,name:"Squadra "+(i+1)}));
  document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");currentTab=t.dataset.tab;render();
  });
  render();
}

function save(){localStorage.setItem("asta2627",JSON.stringify({teams,purchases}));}

function soldIds(){return new Set(purchases.map(p=>p.playerId));}
function teamPurchases(tid){return purchases.filter(p=>p.teamId===tid);}
function teamSpent(tid){return teamPurchases(tid).reduce((s,p)=>s+p.price,0);}
function teamRoleCount(tid,role){return teamPurchases(tid).filter(p=>PLAYERS[p.playerId].role===role).length;}

function render(){
  const app=document.getElementById("app");
  if(currentTab==="registra")app.innerHTML=renderRegistra();
  else if(currentTab==="rose")app.innerHTML=renderRose();
  else if(currentTab==="dashboard")app.innerHTML=renderDashboard();
  else if(currentTab==="listone")app.innerHTML=renderListone();
  bindEvents();
}

function renderRegistra(){
  const sold=soldIds();
  return `
  <div class="stats-bar">
    <div class="stat-card"><div class="stat-val">${purchases.length}</div><div class="stat-label">Acquisti</div></div>

  }).join("")}</div>`;
}

function renderRose(){
  return `<div class="teams-grid">${teams.map(t=>{
    const spent=teamSpent(t.id);
    const tp=teamPurchases(t.id);
    const total=tp.length;
    return `<div class="team-card">
      <div class="team-header" style="background:linear-gradient(135deg,var(--card),rgba(74,250,138,.08))">
        <span contenteditable="true" onblur="renameTeam(${t.id},this.textContent)" style="cursor:text">${t.name}</span>
        <span><span class="team-budget">${BUDGET-spent}</span><span style="color:var(--text2);font-size:11px">/${BUDGET}</span></span>
      </div>
      <div class="team-slots">
        ${ROLES.map(r=>`<span class="slot slot-${r.k}">${r.k} ${teamRoleCount(t.id,r.k)}/${r.max}</span>`).join("")}
        <span style="color:var(--text2);font-size:10px;margin-left:auto">${total}/25</span>
      </div>
      <div class="roster-list">${ROLES.map(r=>{
        const rp=tp.filter(p=>PLAYERS[p.playerId].role===r.k);
        if(!rp.length)return "";
        return `<div class="role-section"><div class="role-label" style="color:${r.c}">${r.n}</div>${rp.map(p=>{
          const pl=PLAYERS[p.playerId];
          return `<div class="roster-player"><span class="rp-name">${pl.name}</span><span class="rp-price">${p.price}</span></div>`;
        }).join("")}</div>`;
      }).join("")}</div>
    </div>`;
  }).join("")}</div>`;
}

function renderDashboard(){
  const sold=soldIds();
  const available=PLAYERS.filter(p=>!sold.has(p.id));
  return `
  <div class="stats-bar">
    ${teams.map(t=>{const s=teamSpent(t.id);return `<div class="stat-card"><div style="font-size:11px;font-weight:700;margin-bottom:4px">${t.name}</div><div class="stat-val" style="font-size:18px">${BUDGET-s}</div><div class="stat-label">${teamPurchases(t.id).length}/25</div></div>`;}).join("")}
  </div>
  <h3 style="color:#4afa8a;margin:16px 0 8px">🏆 Top disponibili per ruolo</h3>
  <div class="teams-grid">${ROLES.map(r=>{
    const top=available.filter(p=>p.role===r.k).sort((a,b)=>b.target-a.target).slice(0,8);
    return `<div class="team-card"><div class="team-header" style="background:${r.c}22"><span style="color:${r.c}">${r.n} (${available.filter(p=>p.role===r.k).length} rimasti)</span></div>
    <div class="roster-list">${top.map(p=>`<div class="roster-player"><span class="rp-name">${p.name} <span style="color:var(--text2);font-size:10px">${p.team}</span></span><span><span style="color:#4afa8a;font-weight:700">€${p.target}</span> <span style="color:var(--text2);font-size:10px">Qt${p.qt}</span></span></div>`).join("")}</div></div>`;
  }).join("")}</div>`;
}

function renderListone(){
  const sold=soldIds();
  return `
  <div class="filter-bar">
    <button class="filter-btn active" data-role="ALL">TUTTI</button>
    ${ROLES.map(r=>`<button class="filter-btn" data-role="${r.k}">${r.n}</button>`).join("")}
    <button class="filter-btn" data-role="AFFARE" style="color:#4afa8a">🟢 AFFARI</button>
    <button class="filter-btn" data-role="TRAPPOLA" style="color:#ef4444">🔴 TRAPPOLE</button>
    <input type="text" id="filterSearch" placeholder="Filtra..." style="padding:6px 12px;font-size:11px;background:var(--card);border:1px solid var(--border);color:#fff;border-radius:20px;width:150px">
  </div>
  <table class="player-table"><thead><tr><th>#</th><th>R</th><th>Nome</th><th>Squadra</th><th>Qt</th><th>FM</th><th>VORP</th><th>TARGET</th><th>MAX</th><th>Segnale</th><th>Stato</th></tr></thead>
  <tbody id="playerRows">${PLAYERS.map((p,i)=>{
    const isSold=sold.has(p.id);
    const sig=p.signal===1?"AFFARE":(p.signal===-1?"TRAPPOLA":"FAIR");
    const tierCls=p.tier>=4?"tier-elite":(p.tier>=3?"tier-top":"");
    const soldInfo=isSold?purchases.find(x=>x.playerId===p.id):null;
    return `<tr class="${isSold?"sold":""} ${tierCls}" data-role="${p.role}" data-signal="${sig}" data-name="${p.name.toLowerCase()}">
      <td>${i+1}</td><td><span class="slot slot-${p.role}">${p.role}</span></td><td style="font-weight:700">${p.name}${!p.hist?" ⚠":""}$</td><td>${p.team}</td><td>${p.qt}</td><td>${p.fm}</td><td>${p.vorp}</td>
      <td style="font-weight:700;color:#4afa8a">€${p.target}</td><td>€${p.max}</td>
      <td><span class="signal ${sig==="AFFARE"?"signal-affare":(sig==="TRAPPOLA"?"signal-trappola":"")}">${sig}</span></td>
      <td>${isSold?`<span style="color:var(--text2)">${teams[soldInfo.teamId].name} x${soldInfo.price}</span>`:"✅"}</td>
    </tr>`;
  }).join("")}</tbody></table>`;
}

function bindEvents(){
  const search=document.getElementById("searchPlayer");
  if(search){
    search.addEventListener("input",e=>{
      const v=e.target.value.toLowerCase();
      const sug=document.getElementById("suggestions");
      if(v.length<2){sug.classList.add("hidden");return;}
      const sold=soldIds();
      const matches=PLAYERS.filter(p=>!sold.has(p.id)&&p.name.toLowerCase().includes(v)).slice(0,10);
      if(!matches.length){sug.innerHTML="<div class='suggestion' style='color:var(--text2)'>Nessun risultato</div>";sug.classList.remove("hidden");return;}
      sug.innerHTML=matches.map(p=>`<div class="suggestion" onclick="selectPlayer(${p.id})">
        <span><span class="slot slot-${p.role}" style="margin-right:6px">${p.role}</span><span class="name">${p.name}</span> <span class="info">${p.team} Qt=${p.qt}</span></span>
        <span><span class="target">€${p.target}</span> <span class="signal ${p.signal===1?"signal-affare":(p.signal===-1?"signal-trappola":"")}">${p.signal===1?"AFFARE":(p.signal===-1?"TRAP":"")}</span></span>
      </div>`).join("");
      sug.classList.remove("hidden");
    });
    search.addEventListener("keydown",e=>{if(e.key==="Escape")document.getElementById("suggestions").classList.add("hidden");});
  }
  // Filter buttons for listone
  document.querySelectorAll(".filter-btn[data-role]").forEach(btn=>{
    btn.onclick=()=>{
      document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      filterListone(btn.dataset.role);
    };
  });
  const fs=document.getElementById("filterSearch");
  if(fs)fs.oninput=()=>filterListone(document.querySelector(".filter-btn.active")?.dataset.role||"ALL");
}

function filterListone(role){
  const search=(document.getElementById("filterSearch")?.value||"").toLowerCase();
  document.querySelectorAll("#playerRows tr").forEach(tr=>{
    const r=tr.dataset.role;const s=tr.dataset.signal;const n=tr.dataset.name||"";
    let show=true;
    if(role==="AFFARE")show=s==="AFFARE";
    else if(role==="TRAPPOLA")show=s==="TRAPPOLA";
    else if(role!=="ALL")show=r===role;
    if(search&&!n.includes(search))show=false;
    tr.style.display=show?"":"none";
  });
}

let selectedPlayerId=null;
function selectPlayer(id){
  selectedPlayerId=id;
  const p=PLAYERS[id];
  document.getElementById("searchPlayer").value=p.name;
  document.getElementById("suggestions").classList.add("hidden");
  document.getElementById("inPrice").focus();
}

function doRegister(){
  const search=document.getElementById("searchPlayer");
  const teamSel=document.getElementById("selTeam");
  const priceIn=document.getElementById("inPrice");
  
  if(selectedPlayerId===null){
    // Try to match by name
    const v=search.value.toLowerCase();
    const sold=soldIds();
    const match=PLAYERS.find(p=>!sold.has(p.id)&&p.name.toLowerCase()===v);
    if(match)selectedPlayerId=match.id;
    else{alert("Seleziona un giocatore dalla lista!");return;}
  }
  
  const price=parseInt(priceIn.value);
  if(!price||price<1){alert("Inserisci un prezzo valido!");return;}
  
  const teamId=parseInt(teamSel.value);
  const pl=PLAYERS[selectedPlayerId];
  
  purchases.push({playerId:selectedPlayerId,teamId,price});
  save();
  
  selectedPlayerId=null;
  search.value="";priceIn.value="";
  search.focus();
  render();
}

function doUndo(){
  if(!purchases.length){alert("Nessun acquisto da annullare!");return;}
  const last=purchases[purchases.length-1];
  const pl=PLAYERS[last.playerId];
  if(confirm("Annullare "+pl.name+"?")){
    purchases.pop();save();render();
  }
}

function renameTeam(id,name){
  teams[id].name=name.trim()||("Squadra "+(id+1));
  save();
}

// Export
function exportCSV(){
  let csv="Pos,Giocatore,Ruolo,Squadra Reale,Squadra Fantasy,Prezzo,Target,Segnale\n";
  purchases.forEach((p,i)=>{
    const pl=PLAYERS[p.playerId];
    csv+=`${i+1},${pl.name},${pl.role},${pl.team},${teams[p.teamId].name},${p.price},${pl.target},${pl.signal===1?"AFFARE":(pl.signal===-1?"TRAPPOLA":"FAIR")}\n`;
  });
  const blob=new Blob([csv],{type:"text/csv"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="asta_2627.csv";a.click();
}
