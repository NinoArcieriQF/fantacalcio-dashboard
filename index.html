*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d0f13;--card:#161922;--green:#1B7A3D;--gold:#FFF8E1;--red:#C62828;--blue:#1565C0;--gray:#888;--border:#2a2d38;--text:#e8e8e8;--text2:#aaa}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:linear-gradient(135deg,#0d1f15,#0a1a1f);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--green);position:sticky;top:0;z-index:100}
.header h1{font-size:15px;letter-spacing:2px;color:#fff;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#4afa8a;box-shadow:0 0 8px #4afa8a;animation:blink 1.5s infinite}
.sync-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-left:8px}
.sync-on{background:#4afa8a;box-shadow:0 0 6px #4afa8a}.sync-off{background:#ef4444}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--card);overflow-x:auto}
.tab{flex:1;padding:10px 6px;text-align:center;font-size:11px;font-weight:700;letter-spacing:1px;cursor:pointer;color:var(--text2);transition:.2s;white-space:nowrap}
.tab.active{color:#4afa8a;border-bottom:2px solid #4afa8a}.tab:hover{color:#fff}
.content{padding:12px;max-width:1400px;margin:0 auto}
.input-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.input-bar input,.input-bar select{background:var(--card);border:1px solid var(--border);color:#fff;padding:10px 14px;border-radius:8px;font-size:14px;outline:none}
.input-bar input:focus,.input-bar select:focus{border-color:var(--green)}
.input-bar input[type=text]{flex:1;min-width:180px}
.input-bar select{min-width:140px}
.input-bar input[type=number]{width:80px}
.btn{padding:10px 20px;border-radius:8px;border:none;font-weight:700;font-size:13px;cursor:pointer;transition:.2s}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{background:#22a04d}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{background:#e53935}
.btn-blue{background:var(--blue);color:#fff}
.btn-sm{padding:6px 12px;font-size:11px}
.suggestions{background:var(--card);border:1px solid var(--green);border-radius:8px;max-height:220px;overflow-y:auto;margin-bottom:8px}
.suggestion{padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);font-size:13px}
.suggestion:hover{background:rgba(74,250,138,.1)}
.teams-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-bottom:16px}
.team-card{background:var(--card);border-radius:12px;border:1px solid var(--border);overflow:hidden}
.team-header{padding:8px 12px;font-weight:700;font-size:13px;display:flex;justify-content:space-between;color:#fff;background:linear-gradient(135deg,var(--card),rgba(74,250,138,.06))}
.team-budget{font-size:18px;font-weight:900;color:#4afa8a}
.team-slots{display:flex;gap:4px;padding:4px 12px;flex-wrap:wrap}
.slot{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:700}
.slot-P{background:rgba(255,152,0,.2);color:#FF9800}.slot-D{background:rgba(33,150,243,.2);color:#2196F3}
.slot-C{background:rgba(76,175,80,.2);color:#4CAF50}.slot-A{background:rgba(233,30,99,.2);color:#E91E63}
.roster-list{padding:4px 8px 8px}
.roster-player{font-size:11px;padding:4px 6px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.03)}
.role-label{font-size:9px;font-weight:700;padding:2px 6px;letter-spacing:1px}
.stats-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.stat-card{background:var(--card);border-radius:10px;padding:10px 12px;border:1px solid var(--border);min-width:80px;text-align:center}
.stat-val{font-size:18px;font-weight:900;color:#4afa8a}.stat-label{font-size:9px;color:var(--text2);margin-top:2px}
.roster-mini{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.roster-chip{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px}
.roster-chip .rc-count{color:#4afa8a;font-size:14px}
table{width:100%;border-collapse:collapse}
th{background:var(--card);padding:8px;font-size:11px;color:var(--text2);text-align:left;position:sticky;top:0;z-index:10}

.log{max-height:200px;overflow-y:auto;margin-top:10px}
.log-entry{padding:6px 10px;font-size:12px;border-left:3px solid var(--green);margin-bottom:3px;background:rgba(74,250,138,.05);border-radius:0 6px 6px 0}
.log-entry.over{border-color:var(--red);background:rgba(198,40,40,.05)}
.hidden{display:none}
.price-up{color:#ef4444;font-size:9px}.price-dn{color:#4afa8a;font-size:9px}

.my-header{background:linear-gradient(135deg,#1a1a2e,rgba(249,168,37,.15));padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.my-header h2{color:#F9A825;font-size:16px}
.my-slot{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border)}
.my-slot:hover{background:rgba(249,168,37,.05)}
.my-slot-num{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px}
.my-slot-target{flex:1;min-width:0}

.my-slot-target input:focus{border-color:#F9A825}
.my-slot-budget{width:70px}

.my-slot-status{width:100px;text-align:center;font-size:11px;font-weight:700}
.status-free{color:#4afa8a}.status-bought{color:#F9A825}.status-taken{color:#ef4444}

.my-sugg-item{padding:6px 10px;cursor:pointer;font-size:11px;display:flex;justify-content:space-between;border-bottom:1px solid var(--border)}
.my-sugg-item:hover{background:rgba(249,168,37,.1)}
.li-card{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:16px;margin-bottom:10px}
.li-bar{height:6px;border-radius:3px;background:var(--border);overflow:hidden;margin-top:6px}
.li-fill{height:100%;border-radius:3px;transition:width .3s}

// Dynamic engine
function recalc(){var sold=new Set(S.purchases.map(function(p){return p.pid}));var avail=PLAYERS.filter(function(p){return !sold.has(p.id)});var tBL=S.teams.reduce(function(s,t){return s+(BUDGET-tSpent(t.id))},0);var tSL=250-S.purchases.length;var spend=Math.max(0,tBL-tSL);var repl={};RC.forEach(function(r){var rp=avail.filter(function(p){return p.role===r.k}).sort(function(a,b){return b.vorp-a.vorp});var idx=Math.min(r.max*10-1,rp.length-1);repl[r.k]=idx>=0?rp[idx].vorp:0;});var scar={};RC.forEach(function(r){var ac=avail.filter(function(p){return p.role===r.k&&p.vorp>0}).length;var nc=r.max*10-S.purchases.filter(function(p){return PLAYERS[p.pid].role===r.k}).length;scar[r.k]=ac>0?nc/ac:1;});var tv=0;avail.forEach(function(p){p._dv=Math.max(0,p.vorp-repl[p.role])*(1+Math.max(0,scar[p.role]-0.3));tv+=p._dv;});PLAYERS.forEach(function(p){if(sold.has(p.id))return;if(tv>0){p.target=Math.max(1,Math.round(p._dv/tv*spend));p.max=Math.round(p.target*1.25);}p._delta=p.target-p.baseTarget;});}
function soldSet(){return new Set(S.purchases.map(function(p){return p.pid}));}
function tPurch(tid){return S.purchases.filter(function(p){return p.tid===tid});}
function tSpent(tid){return tPurch(tid).reduce(function(s,p){return s+p.price},0);}
function tRC(tid,role){return tPurch(tid).filter(function(p){return PLAYERS[p.pid].role===role}).length;}

// Live Index
var QT_TH=5;
function calcLI(){var li={P:{ratio:[],avg:1,pressure:1,variance:0},D:{ratio:[],avg:1,pressure:1,variance:0},C:{ratio:[],avg:1,pressure:1,variance:0},A:{ratio:[],avg:1,pressure:1,variance:0}};S.purchases.forEach(function(pu,idx){var pl=PLAYERS[pu.pid];if(pl.qt>=QT_TH){var w=1+idx*0.02;li[pl.role].ratio.push({r:pu.price/pl.qt,w:w,name:pl.name,qt:pl.qt,price:pu.price});}});RC.forEach(function(r){var d=li[r.k].ratio;if(d.length>0){var tw=d.reduce(function(s,x){return s+x.w},0);li[r.k].avg=d.reduce(function(s,x){return s+x.r*x.w},0)/tw;var m=li[r.k].avg;li[r.k].variance=d.length>1?Math.sqrt(d.reduce(function(s,x){return s+Math.pow(x.r-m,2)},0)/d.length):m*0.2;}var tbl=S.teams.reduce(function(s,t){return s+(BUDGET-tSpent(t.id))},0);var tsl=250-S.purchases.length;var aps=tsl>0?tbl/tsl:0;li[r.k].pressure=Math.max(0.3,Math.min(2,aps/14));});var ar=S.purchases.filter(function(p){return PLAYERS[p.pid].qt>=QT_TH}).map(function(p){return p.price/PLAYERS[p.pid].qt});li.global=ar.length>0?ar.reduce(function(a,b){return a+b},0)/ar.length:1;li.gc=ar.length;li.tbl=S.teams.reduce(function(s,t){return s+(BUDGET-tSpent(t.id))},0);li.tsl=250-S.purchases.length;li.aps=li.tsl>0?Math.round(li.tbl/li.tsl):0;return li;}
function getEV(p){var li=calcLI();var r=p.role;if(p.qt<QT_TH||li[r].ratio.length<2)return{low:p.target,high:p.max,ev:p.target,conf:"low"};var bev=p.qt*li[r].avg*li[r].pressure;var sp=p.qt*(li[r].variance||li[r].avg*0.2)*li[r].pressure;return{low:Math.max(1,Math.round(bev-sp)),high:Math.round(bev+sp),ev:Math.round(bev),conf:li[r].ratio.length>=5?"high":(li[r].ratio.length>=3?"mid":"low")};}

function renderMia(){var sold=soldSet();var myP=tPurch(MY_ID);var spent=tSpent(MY_ID);var tb=0;["P","D","C","A"].forEach(function(r){if(S.myBudgets[r])S.myBudgets[r].forEach(function(b){tb+=parseInt(b)||0;});});var h='<div class="stats-bar"><div class="stat-card"><div class="stat-val" style="color:#F9A825">'+(BUDGET-spent)+'</div><div class="stat-label">Budget</div></div><div class="stat-card"><div class="stat-val">'+myP.length+'</div><div class="stat-label">Acquistati</div></div><div class="stat-card"><div class="stat-val">'+(25-myP.length)+'</div><div class="stat-label">Liberi</div></div><div class="stat-card"><div class="stat-val" style="color:'+(tb>BUDGET?"#ef4444":"#4afa8a")+'">'+tb+'</div><div class="stat-label">Allocato</div></div><div class="stat-card"><div class="stat-val">'+Math.max(0,BUDGET-tb)+'</div><div class="stat-label">Non alloc.</div></div></div>';RC.forEach(function(r){var bo=myP.filter(function(p){return PLAYERS[p.pid].role===r.k});h+='<div class="my-section"><div class="my-header"><h2>'+r.n+' ('+bo.length+'/'+r.max+')</h2></div>';for(var i=0;i<r.max;i++){var tp=S.mySlots[r.k]?S.mySlots[r.k][i]:null;var bv=S.myBudgets[r.k]?S.myBudgets[r.k][i]:"";var bp=bo[i]?PLAYERS[bo[i].pid]:null;var bpr=bo[i]?bo[i].price:null;var tn="",ts="",sc="";if(bp){tn=bp.name;ts="✅ "+bpr+"cr";sc="status-bought";}else if(tp!==null&&tp!==undefined){var pp=PLAYERS[tp];if(pp){tn=pp.name;if(sold.has(pp.id)){var w=S.purchases.find(function(x){return x.pid===pp.id});ts="❌ "+S.teams[w.tid].name;sc="status-taken";}else{var ev=getEV(pp);ts="EV "+ev.low+"-"+ev.high;sc="status-free";}}}h+='<div class="my-slot"><div class="my-slot-num" style="background:'+r.c+'22;color:'+r.c+'">'+r.k+(i+1)+'</div><div class="my-slot-target" style="position:relative"><input type="text" placeholder="Cerca..." value="'+tn+'" data-role="'+r.k+'" data-idx="'+i+'" '+(bp?'disabled style="opacity:.6"':'')+' oninput="searchSlot(this)" onfocus="searchSlot(this)" onblur="setTimeout(function(){hideSlotSugg(\''+r.k+'\','+i+')},200)"><div id="slotSugg_'+r.k+'_'+i+'" class="my-sugg hidden"></div></div><div class="my-slot-budget"><input type="number" placeholder="€" value="'+(bpr||bv)+'" data-role="'+r.k+'" data-idx="'+i+'" '+(bp?'disabled style="opacity:.6"':'')+' onchange="setBudget(this)"></div><div class="my-slot-status '+sc+'">'+ts+'</div></div>';}h+='</div>';});return h;}

function setBudget(el){var role=el.dataset.role;var idx=parseInt(el.dataset.idx);if(!S.myBudgets[role])S.myBudgets[role]=Array(RC.find(function(r){return r.k===role}).max).fill("");S.myBudgets[role][idx]=el.value;saveFS();}

// LISTONE
function renderList(){var sold=soldSet();return '<div class="import-bar"><span style="color:var(--text2);font-size:11px">📁 Importa listone:</span><input type="file" id="fileInput" accept=".xlsx,.xls" onchange="importListone(this)" style="font-size:11px;color:var(--text2)"></div><div class="filter-bar"><button class="filter-btn active" data-role="ALL">TUTTI</button>'+RC.map(function(r){return '<button class="filter-btn" data-role="'+r.k+'">'+r.n+'</button>'}).join("")+'<input type="text" id="filterS" placeholder="Filtra..." style="padding:6px 12px;font-size:11px;background:var(--card);border:1px solid var(--border);color:#fff;border-radius:20px;width:140px"></div><table><thead><tr><th>#</th><th>R</th><th>Nome</th><th>Squadra</th><th>Qt</th><th>FM</th><th>VORP</th><th>PREZZO</th><th>EV</th><th>Stato</th></tr></thead><tbody id="listRows">'+PLAYERS.map(function(p,i){var is=sold.has(p.id);var si=S.purchases.find(function(x){return x.pid===p.id});var ev=getEV(p);return '<tr class="'+(is?"sold":"")+'" data-role="'+p.role+'" data-name="'+p.name.toLowerCase()+'"><td>'+(i+1)+'</td><td><span class="slot slot-'+p.role+'">'+p.role+'</span></td><td style="font-weight:700">'+p.name+(p.hist?"":" ⚠")+'</td><td>'+p.team+'</td><td>'+p.qt+'</td><td>'+p.fm+'</td><td>'+p.vorp+'</td><td style="font-weight:700;color:#4afa8a">€'+p.target+'</td><td style="color:#F9A825;font-weight:700">€'+ev.ev+' <span style="color:var(--text2);font-size:10px">'+ev.low+'-'+ev.high+'</span></td><td>'+(is?'<span style="color:var(--text2)">'+S.teams[si.tid].name+' x'+si.price+'</span>':"✅")+'</td></tr>'}).join("")+'</tbody></table>';}

// LIVE INDEX
function renderLI(){var li=calcLI();var sold=soldSet();var av=PLAYERS.filter(function(p){return !sold.has(p.id)});var h='<div class="stats-bar"><div class="stat-card"><div class="stat-val" style="color:#F9A825">'+li.global.toFixed(2)+'x</div><div class="stat-label">Live-Index</div></div><div class="stat-card"><div class="stat-val">'+li.gc+'</div><div class="stat-label">Sample</div></div><div class="stat-card"><div class="stat-val">'+li.tbl+'</div><div class="stat-label">Crediti</div></div><div class="stat-card"><div class="stat-val">'+li.aps+'</div><div class="stat-label">€/slot</div></div></div><h3 style="color:#F9A825;margin:12px 0 8px">📊 Live-Index per ruolo</h3><div class="teams-grid">';RC.forEach(function(r){var d=li[r.k];var pc=Math.min(100,d.avg*50);var bc=d.avg>1.5?"#ef4444":(d.avg>1.1?"#F9A825":"#4afa8a");var tr=d.avg>1.3?"🔥 CALDO":(d.avg>1?"📈 Sopra Qt":"📉 Sotto Qt");h+='<div class="li-card"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-weight:700;color:'+r.c+'">'+r.n+'</span><span style="font-size:20px;font-weight:900;color:'+bc+'">'+d.avg.toFixed(2)+'x</span></div><div style="color:var(--text2);font-size:11px;margin:4px 0">'+d.ratio.length+' acquisti | Pressione: '+(d.pressure*100).toFixed(0)+'% | '+tr+'</div><div class="li-bar"><div class="li-fill" style="width:'+pc+'%;background:'+bc+'"></div></div>'+(d.ratio.length>0?'<div style="margin-top:8px;font-size:10px;color:var(--text2)">'+d.ratio.slice(-5).map(function(x){return x.name+" Qt"+x.qt+"→"+x.price+" ("+(x.r).toFixed(1)+"x)"}).join(" | ")+'</div>':"")+'</div>';});h+='</div><h3 style="color:#4afa8a;margin:16px 0 8px">💎 Estimated Value</h3>';RC.forEach(function(r){var top=av.filter(function(p){return p.role===r.k&&p.qt>=QT_TH}).sort(function(a,b){return b.qt-a.qt}).slice(0,10);if(!top.length)return;h+='<div class="li-card"><div style="font-weight:700;color:'+r.c+';margin-bottom:8px">'+r.n+'</div><table style="width:100%"><thead><tr><th>Nome</th><th>Squadra</th><th>Qt</th><th>EV</th><th>Range</th><th>Conf.</th></tr></thead><tbody>';top.forEach(function(p){var ev=getEV(p);var cc=ev.conf==="high"?"#4afa8a":(ev.conf==="mid"?"#F9A825":"#888");h+='<tr><td style="font-weight:700">'+p.name+'</td><td style="color:var(--text2)">'+p.team+'</td><td>'+p.qt+'</td><td style="font-weight:700;color:#F9A825;font-size:14px">€'+ev.ev+'</td><td style="color:var(--text2)">'+ev.low+'-'+ev.high+'</td><td><span style="color:'+cc+';font-size:10px;font-weight:700">'+ev.conf.toUpperCase()+'</span></td></tr>';});h+='</tbody></table></div>';});return h;}

// Svincola
function doSvincola(pid){var pl=PLAYERS[pid];if(!confirm("Svincolare "+pl.name+"?"))return;var idx=S.purchases.findIndex(function(p){return p.pid===pid});if(idx>=0){S.purchases.splice(idx,1);recalc();saveFS();render();}}

// Import listone (placeholder)
function importListone(el){alert("Funzione in sviluppo — carica il nuovo listone nella prossima versione");}

// Events
function bindAll(){var s=document.getElementById("searchP");if(s){s.addEventListener("input",function(e){var v=e.target.value.toLowerCase();var sg=document.getElementById("sugg");if(v.length<2){sg.classList.add("hidden");return;}var sold=soldSet();var m=PLAYERS.filter(function(p){return !sold.has(p.id)&&p.name.toLowerCase().indexOf(v)>=0}).slice(0,10);if(!m.length){sg.innerHTML="<div class='suggestion' style='color:var(--text2)'>Nessuno</div>";sg.classList.remove("hidden");return;}sg.innerHTML=m.map(function(p){var ev=getEV(p);return '<div class="suggestion" onclick="selP('+p.id+')"><span><span class="slot slot-'+p.role+'" style="margin-right:6px">'+p.role+'</span><span style="font-weight:700">'+p.name+'</span> <span style="color:var(--text2);font-size:11px">'+p.team+' Qt='+p.qt+'</span></span><span style="color:#4afa8a;font-weight:700;font-size:14px">€'+p.target+'</span><span class="ev-tag">EV '+ev.low+'-'+ev.high+'</span></div>'}).join("");sg.classList.remove("hidden");});s.addEventListener("keydown",function(e){if(e.key==="Escape")document.getElementById("sugg").classList.add("hidden");});}document.querySelectorAll(".filter-btn[data-role]").forEach(function(b){b.onclick=function(){document.querySelectorAll(".filter-btn").forEach(function(x){x.classList.remove("active")});b.classList.add("active");filterRows(b.dataset.role);};});var fs=document.getElementById("filterS");if(fs)fs.oninput=function(){filterRows(document.querySelector(".filter-btn.active").dataset.role||"ALL");};}
function filterRows(role){var search=(document.getElementById("filterS")||{}).value;search=search?search.toLowerCase():"";var tbody=document.getElementById("listRows");if(!tbody)return;var rows=tbody.querySelectorAll("tr");for(var i=0;i<rows.length;i++){var tr=rows[i];var r=tr.dataset.role;var n=tr.dataset.name||"";var show=true;if(role!=="ALL")show=r===role;if(search&&n.indexOf(search)<0)show=false;tr.style.display=show?"":"none";}}
var selPid=null;
function selP(id){selPid=id;document.getElementById("searchP").value=PLAYERS[id].name;document.getElementById("sugg").classList.add("hidden");document.getElementById("inPr").focus();}
function doReg(){var si=document.getElementById("searchP"),ti=document.getElementById("selT"),pi=document.getElementById("inPr");if(selPid===null){var v=si.value.toLowerCase();var sold=soldSet();var m=PLAYERS.filter(function(p){return !sold.has(p.id)&&p.name.toLowerCase()===v})[0];if(m)selPid=m.id;else{alert("Seleziona un giocatore!");return;}}var price=parseInt(pi.value);if(!price||price<1){alert("Prezzo!");return;}S.purchases.push({pid:selPid,tid:parseInt(ti.value),price:price});recalc();saveFS();selPid=null;si.value="";pi.value="";si.focus();render();}
function doUndo(){if(!S.purchases.length)return;if(confirm("Annullare "+PLAYERS[S.purchases[S.purchases.length-1].pid].name+"?")){S.purchases.pop();recalc();saveFS();render();}}
init();

</script>
</body></html>
